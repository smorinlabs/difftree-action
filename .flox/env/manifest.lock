    "vars": {
      "DIFFTREE_VERSION": "v0.3.1"
    },
    "hook": {
      "on-activate": "  # Install the difftree CLI from its prebuilt release binary (checksum-verified),\n  # into the per-project cache. Re-runs only when missing or version-bumped.\n  bin_dir=\"$FLOX_ENV_CACHE/bin\"\n  ver=\"$DIFFTREE_VERSION\"\n  if [ \"$(\"$bin_dir/difftree\" --version 2>/dev/null)\" != \"difftree ${ver#v}\" ]; then\n    case \"$(uname -sm)\" in\n      \"Darwin arm64\")  target=\"aarch64-apple-darwin\" ;;\n      \"Darwin x86_64\") target=\"x86_64-apple-darwin\" ;;\n      \"Linux aarch64\") target=\"aarch64-unknown-linux-gnu\" ;;\n      \"Linux x86_64\")  target=\"x86_64-unknown-linux-gnu\" ;;\n      *) target=\"\" ;;\n    esac\n    if [ -z \"$target\" ]; then\n      echo \"difftree: no prebuilt binary for $(uname -sm) — run: cargo install difftree\" >&2\n    else\n      asset=\"difftree-${ver}-${target}.tar.gz\"\n      url=\"https://github.com/smorinlabs/difftree/releases/download/${ver}/${asset}\"\n      tmp=\"$(mktemp -d)\"\n      if curl -fsSL -o \"$tmp/$asset\" \"$url\" && curl -fsSL -o \"$tmp/$asset.sha256\" \"$url.sha256\"; then\n        if (cd \"$tmp\" && { shasum -a 256 -c \"$asset.sha256\" || sha256sum -c \"$asset.sha256\"; } >/dev/null 2>&1) \\\n          && tar -xzf \"$tmp/$asset\" -C \"$tmp\"; then\n          mkdir -p \"$bin_dir\"\n          find \"$tmp\" -type f -name difftree -exec mv {} \"$bin_dir/difftree\" ';'\n          chmod +x \"$bin_dir/difftree\"\n          echo \"✓ difftree ${ver} → $bin_dir/difftree\" >&2\n        else\n          echo \"difftree: checksum/extract failed — install manually: cargo install difftree\" >&2\n        fi\n      else\n        echo \"difftree: download failed (offline?) — install manually: cargo install difftree\" >&2\n      fi\n      rm -rf \"$tmp\"\n    fi\n  fi\n"
    },
    "profile": {
      "common": "  export PATH=\"$FLOX_ENV_CACHE/bin:$PATH\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "x86_64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
