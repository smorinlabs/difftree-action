name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    # Runs inside the repo's Flox environment (.flox/env/manifest.toml) so CI
    # exercises the exact toolchain contributors get from `flox activate` —
    # node, actionlint, shellcheck, and yq all come from the committed lock,
    # not from runner preinstalls or per-tool setup actions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flox
        uses: flox/install-flox-action@v2

      - name: Unit tests
        run: flox activate -- node --test

      - name: actionlint
        run: flox activate -- actionlint

      - name: shellcheck action.yml embedded bash
        run: |
          eval "$(flox activate)"
          set -euo pipefail
          rc=0
          count="$(yq '.runs.steps | length' action.yml)"
          for i in $(seq 0 $((count - 1))); do
            shell="$(yq ".runs.steps[$i].shell // \"\"" action.yml)"
            [ "$shell" = "bash" ] || continue
            name="$(yq ".runs.steps[$i].name // \"\"" action.yml)"
            { echo '#!/usr/bin/env bash'; yq ".runs.steps[$i].run" action.yml; } >/tmp/step.sh
            sed -i 's/[$][{][{][^}]*[}][}]/EXPR/g' /tmp/step.sh   # neutralize GHA expressions
            if ! shellcheck -S warning /tmp/step.sh; then
              echo "## shellcheck findings in step: $name"
              rc=1
            fi
          done
          exit $rc

  smoke:
    # End-to-end smoke: actually install difftree and run the action against this
    # PR, computing outputs without posting a comment (works on forks too).
    # Deliberately NOT floxified: this job must prove the action works on an
    # unmodified runner, exactly the way consumers run it.
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: dt
        uses: ./
        with:
          comment: false

      - name: Assert the action produced a change count
        env:
          FILES: ${{ steps.dt.outputs.files-changed }}
          TREE: ${{ steps.dt.outputs.tree }}
        run: |
          echo "files-changed=$FILES"
          # This PR always changes files, so a real run must report > 0;
          # catches an always-zero parse (e.g. a difftree JSON-shape change).
          test "${FILES:-0}" -gt 0
          test -n "$TREE"
