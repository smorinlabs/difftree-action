schema-version = "1.15.0"
# Generated by /floxify
#
# One command onboards a developer: `flox activate` pins the toolchain CI
# uses (node --test, actionlint, shellcheck, yq) and installs the difftree
# CLI itself from its prebuilt release binary (difftree is not in the Flox
# catalog; the version mirrors action.yml's `difftree-version` default —
# keep the two in sync).

[install]
nodejs.pkg-path = "nodejs_20"      # ← .github/workflows/ci.yml setup-node "20"
actionlint.pkg-path = "actionlint" # ← ci.yml actionlint step
shellcheck.pkg-path = "shellcheck" # ← ci.yml shellcheck step
yq.pkg-path = "yq-go"              # ← ci.yml uses the Go yq preinstalled on runners
curl.pkg-path = "curl"             # hook: difftree release download

[vars]
# Mirrors action.yml's `difftree-version` default (tag form). Bump both together.
DIFFTREE_VERSION = "v0.3.1"

[hook]
on-activate = '''
  # Install the difftree CLI from its prebuilt release binary (checksum-verified),
  # into the per-project cache. Re-runs only when missing or version-bumped.
  bin_dir="$FLOX_ENV_CACHE/bin"
  ver="$DIFFTREE_VERSION"
  if [ "$("$bin_dir/difftree" --version 2>/dev/null)" != "difftree ${ver#v}" ]; then
    case "$(uname -sm)" in
      "Darwin arm64")  target="aarch64-apple-darwin" ;;
      "Darwin x86_64") target="x86_64-apple-darwin" ;;
      "Linux aarch64") target="aarch64-unknown-linux-gnu" ;;
      "Linux x86_64")  target="x86_64-unknown-linux-gnu" ;;
      *) target="" ;;
    esac
    if [ -z "$target" ]; then
      echo "difftree: no prebuilt binary for $(uname -sm) — run: cargo install difftree" >&2
    else
      asset="difftree-${ver}-${target}.tar.gz"
      url="https://github.com/smorinlabs/difftree/releases/download/${ver}/${asset}"
      tmp="$(mktemp -d)"
      if curl -fsSL -o "$tmp/$asset" "$url" && curl -fsSL -o "$tmp/$asset.sha256" "$url.sha256"; then
        if (cd "$tmp" && { shasum -a 256 -c "$asset.sha256" || sha256sum -c "$asset.sha256"; } >/dev/null 2>&1) \
          && tar -xzf "$tmp/$asset" -C "$tmp"; then
          mkdir -p "$bin_dir"
          find "$tmp" -type f -name difftree -exec mv {} "$bin_dir/difftree" ';'
          chmod +x "$bin_dir/difftree"
          echo "✓ difftree ${ver} → $bin_dir/difftree" >&2
        else
          echo "difftree: checksum/extract failed — install manually: cargo install difftree" >&2
        fi
      else
        echo "difftree: download failed (offline?) — install manually: cargo install difftree" >&2
      fi
      rm -rf "$tmp"
    fi
  fi
'''

[profile]
common = '''
  export PATH="$FLOX_ENV_CACHE/bin:$PATH"
'''

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
